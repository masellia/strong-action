title: STRONG
description: Strengthening Excellence in Research through Global Networking
keywords: STRONG, MSCA, staff exchanges, gravitational physics, research network
lang: en
icon: strong-logo.png

url: "https://masellia.github.io"
baseurl: "/strong-action"

navbar_fixed: true
footer_fixed: true
max_width: 930px

search_enabled: true
enable_darkmode: true
enable_progressbar: true
enable_math: true
enable_medium_zoom: true
back_to_top: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include:
  - _pages
  - _scripts

exclude:
  - AGENTS.md
  - bin/
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - vendor/

plugins:
  - jekyll-cache-bust
  - jekyll-minifier
  - jekyll-sitemap

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: true
  exclude:
    - robots.txt
    - assets/js/search/*.js

third_party_libraries:
  google_fonts:
    url: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  jquery:
    integrity:
      js: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    url:
      js: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
  medium_zoom:
    integrity:
      js: "sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc="
    url:
      js: "https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"
  polyfill:
    url:
      js: "https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"
